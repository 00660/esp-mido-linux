name: build-gemini-msm8996

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: "msm8996-mainline tag"
        required: true
        default: "v6.19.5-msm8996"
  push:
    paths:
      - ".github/workflows/build-gemini-msm8996.yml"
      - "gemini-build/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      KERNEL_TAG: ${{ inputs.kernel_tag || 'v6.19.5-msm8996' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker --version

      - name: Build Full Flash Package In Ubuntu 20.04
        run: |
          sudo docker run --rm --privileged \
            -e DEBIAN_FRONTEND=noninteractive \
            -e GITHUB_WORKSPACE=/workspace \
            -e KERNEL_TAG="${KERNEL_TAG}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            ubuntu:20.04 \
            /bin/bash -lc '
              apt-get update
              apt-get install -y \
                sudo \
                bc \
                bison \
                binfmt-support \
                build-essential \
                ca-certificates \
                cpio \
                curl \
                debhelper \
                dpkg-dev \
                device-tree-compiler \
                dwarves \
                e2fsprogs \
                fakeroot \
                flex \
                gcc-10-aarch64-linux-gnu \
                gcc-aarch64-linux-gnu \
                git \
                img2simg \
                kernel-package \
                kmod \
                libdw-dev \
                libelf-dev \
                libfdt-dev \
                libncurses-dev \
                libpci-dev \
                libssl-dev \
                lz4 \
                lzop \
                make \
                mkbootimg \
                pkg-config \
                python3 \
                qemu-user-static \
                rsync \
                simg2img \
                unzip \
                zip \
                xz-utils \
                zstd
              update-binfmts --enable qemu-aarch64 || true
              cd /workspace
              bash gemini-build/build-kernel.sh
              chmod -R a+rX /workspace/out || true
            '

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-msm8996-${{ env.KERNEL_TAG }}
          if-no-files-found: warn
          path: out/**
