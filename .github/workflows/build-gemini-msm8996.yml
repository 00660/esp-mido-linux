name: build-gemini-msm8996

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: "msm8996-mainline tag"
        required: true
        default: "v6.1.14-msm8996"
      rootfs_uuid:
        description: "Reserved input, full-flash build auto-detects the new rootfs UUID"
        required: true
        default: "93afcbbe-875f-49b0-83da-ee8193f20ca5"
  push:
    paths:
      - ".github/workflows/build-gemini-msm8996.yml"
      - "gemini-build/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      KERNEL_TAG: ${{ inputs.kernel_tag || 'v6.1.14-msm8996' }}
      ROOTFS_UUID: ${{ inputs.rootfs_uuid || '93afcbbe-875f-49b0-83da-ee8193f20ca5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            apt-utils \
            android-sdk-libsparse-utils \
            bc \
            bison \
            binfmt-support \
            binutils-aarch64-linux-gnu \
            bzip2 \
            build-essential \
            ca-certificates \
            cpio \
            curl \
            debhelper \
            dpkg-dev \
            device-tree-compiler \
            dwarves \
            e2fsprogs \
            fakeroot \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-none-eabi \
            git \
            img2simg \
            kmod \
            kernel-package \
            libdw-dev \
            libelf-dev \
            libfdt-dev \
            libncurses-dev \
            libpci-dev \
            libssl-dev \
            lz4 \
            lzop \
            make \
            mkbootimg \
            pkg-config \
            python3 \
            qemu-user-static \
            rsync \
            simg2img \
            unzip \
            zip \
            xz-utils \
            zstd

      - name: Build Full Flash Package
        run: bash gemini-build/build-kernel.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-msm8996-${{ env.KERNEL_TAG }}
          if-no-files-found: warn
          path: out/**
